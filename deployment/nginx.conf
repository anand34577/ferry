# HTTPS for Ferry with nginx. Replace files.example.com with your domain; set FERRY_PUBLIC_URL and FERRY_TRUSTED_PROXIES=127.0.0.1
# (when nginx runs in another Docker container, use its network instead, e.g. FERRY_TRUSTED_PROXIES=172.16.0.0/12).
# Large uploads and long downloads need unlimited body size and no buffering.
server {
    listen 80;
    listen [::]:80;
    server_name files.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.example.com;
    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;

    client_max_body_size 0;
    proxy_http_version 1.1;          # needed for streamed (unbuffered) request bodies and keep-alive
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
