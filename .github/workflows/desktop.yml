name: Desktop
on:
  push: { paths: ["desktop/**", ".github/workflows/desktop.yml"] }
  pull_request: { paths: ["desktop/**"] }
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26.x", check-latest: true, cache-dependency-path: desktop/go.sum }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/frontend/package-lock.json }
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: go test ./internal/...
      - name: Type-check the UI
        run: cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: Build app and installer
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || { choco install innosetup -y --no-progress; }
          wails build -clean -trimpath -ldflags "-X main.version=dev-${GITHUB_SHA::7}"
          "$iscc" //Q //DAppVersion=0.0.0 build/windows/installer.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: ferry-windows, path: desktop/build/bin/* }
